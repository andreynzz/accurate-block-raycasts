name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run unit tests
        run: ./gradlew test

      - name: Run server GameTests
        run: ./gradlew runGameTest

      - name: Build mod
        run: ./gradlew build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accurate-block-raycasts
          path: build/libs/*.jar
          if-no-files-found: warn
